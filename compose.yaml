name: batdongsan

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
      MYSQL_DATABASE: batdongsan
      MYSQL_USER: bds_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Required}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: batdongsan-backend:1.0
    restart: unless-stopped

    ports:
      - "127.0.0.1:5001:5001"

    environment:
      NODE_ENV: production
      PORT: "5001"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: bds_app
      DB_PASSWORD: ${DB_PASSWORD:?Required}
      DB_NAME: batdongsan
      JWT_SECRET: ${JWT_SECRET:?Required}
      CLIENT_URL: "https://batdongsan.my.id,https://www.batdongsan.my.id,http://localhost:5173"

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
